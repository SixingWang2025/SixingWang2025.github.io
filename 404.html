<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 - 页面未找到 | Tangent</title>
    <!--noinspection CssUnusedSymbol-->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #f5f7fa, #e4e8f0);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 15px;
            overflow-x: hidden;
        }

        /* ---- 404 区域 ---- */
        .status-code {
            color: #3f51b5;
            font-size: clamp(64px, 15vw, 100px);
            font-weight: 900;
            line-height: 1;
            margin-top: 10px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.1);
            opacity: 0.9;
        }

        .not-found-text {
            color: #5c6bc0;
            font-size: clamp(18px, 4vw, 26px);
            margin: 8px 0 12px;
            font-weight: bold;
        }

        /* ---- 游戏标题区域 ---- */
        .game-title {
            color: #3f51b5;
            margin: 10px 0 12px;
            font-size: clamp(18px, 4vw, 24px);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        #difficulty-selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 12px 0;
            width: 100%;
            max-width: 500px;
        }

        .difficulty-btn {
            padding: 8px 15px;
            font-size: clamp(14px, 3vw, 16px);
            background: #e8eaf6;
            color: #3f51b5;
            border: 2px solid #3f51b5;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .difficulty-btn:hover {
            background: #d1d9ff;
        }

        .difficulty-btn.selected {
            background: #3f51b5;
            color: white;
        }

        #stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px 0;
            font-size: clamp(16px, 3.5vw, 20px);
            width: 100%;
            max-width: 500px;
        }

        #stats span {
            background: rgba(255,255,255,0.8);
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #game-container {
            display: grid;
            gap: clamp(8px, 2vw, 12px);
            margin: 10px auto;
            perspective: 1000px;
            width: 95%;
            max-width: 500px;
        }

        .card {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            cursor: default;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.6);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            padding: 5px;
        }

        .card-front {
            background: linear-gradient(135deg, #3f51b5, #5c6bc0);
        }

        .card-back {
            background: white;
            transform: rotateY(180deg);
            color: #3f51b5;
            font-size: clamp(24px, 7vw, 40px);
            font-weight: bold;
            border: 2px solid #e8eaf6;
        }

        /* ---- 按钮通用样式 ---- */
        .btn {
            padding: clamp(6px, 1.5vw, 10px) clamp(18px, 4vw, 26px);
            font-size: clamp(14px, 3vw, 17px);
            font-family: inherit;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            appearance: none;
            -webkit-appearance: none;
            background: linear-gradient(to right, #3f51b5, #303f9f);
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-home {
            background: linear-gradient(to right, #3f51b5, #303f9f);
        }

        /* ---- 底部按钮区 ---- */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 12px 0;
            width: 100%;
            max-width: 500px;
        }

        /* ---- 底部信息 ---- */
        .footer-info {
            color: #9fa8da;
            font-size: clamp(12px, 2.5vw, 14px);
            margin-top: 8px;
            margin-bottom: 20px;
        }

        .footer-info a {
            color: #5c6bc0;
            text-decoration: none;
            font-weight: bold;
        }

        .footer-info a:hover {
            text-decoration: underline;
        }

        /* 胜利动画 */
        @keyframes celebration {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .celebrate {
            animation: celebration 0.5s ease-in-out 3;
        }

        /* 响应式调整 */
        @media (max-width: 500px) {
            .card-back {
                font-size: clamp(20px, 8vw, 36px);
            }
        }

        @media (max-width: 400px) {
            #game-container {
                gap: 5px;
            }
            .btn {
                padding: clamp(4px, 1.5vw, 8px) clamp(12px, 3vw, 20px);
                font-size: clamp(12px, 2.8vw, 15px);
            }
            .action-buttons {
                gap: 8px;
            }
            .difficulty-btn {
                padding: 6px 12px;
                font-size: 13px;
            }
        }

        @media (max-width: 360px) {
            .action-buttons {
                flex-direction: column;
                align-items: center;
                gap: 6px;
            }
        }

        @media (max-width: 350px) {
            .card-back {
                font-size: clamp(18px, 9vw, 32px);
            }
            .difficulty-btn {
                padding: 4px 8px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- ====== 404 提示 ====== -->
    <div class="status-code">404</div>
    <div class="not-found-text">您访问的页面并不存在，不如来玩一局翻牌游戏放松一下？</div>

    <!-- ====== 游戏标题 ====== -->
    <div class="game-title">🃏 记忆翻牌游戏：找到所有匹配的卡片对！</div>

    <!-- ====== 难度选择 ====== -->
    <div id="difficulty-selector">
        <button class="difficulty-btn" data-pairs="4">简单 (4对)</button>
        <button class="difficulty-btn selected" data-pairs="6">中等 (6对)</button>
        <button class="difficulty-btn" data-pairs="8">困难 (8对)</button>
        <button class="difficulty-btn" data-pairs="10">专家 (10对)</button>
    </div>

    <!-- ====== 状态 ====== -->
    <div id="stats">
        <span id="moves">移动: 0</span>
        <span id="pairs">匹配: 0/<span id="total-pairs">6</span></span>
    </div>

    <!-- ====== 游戏区域 ====== -->
    <div id="game-container"></div>

    <!-- ====== 按钮 ====== -->
    <div class="action-buttons">
        <button id="restart-btn" class="btn btn-home">重新开始</button>
        <a href="https://sixingwang2025.github.io/" class="btn btn-home">🏠 返回主页</a>
        <a href="https://sixingwang2025.github.io/blog/" class="btn btn-home">📝 访问博客</a>
    </div>

    <div class="footer-info">
        by PaleTangent_浅色切线 · <a href="https://sixingwang2025.github.io/">sixingwang2025.github.io</a>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const movesDisplay = document.getElementById('moves');
        const pairsDisplay = document.getElementById('pairs');
        const totalPairsDisplay = document.getElementById('total-pairs');
        const restartBtn = document.getElementById('restart-btn');
        const difficultyBtns = document.querySelectorAll('.difficulty-btn');

        const cardSymbols = [
            '🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼',
            '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔',
            '🦄', '🐝', '🐳', '🦓', '🐿️', '🦉', '🐙', '🦋'
        ];
        let cards = [];
        let flippedCards = [];
        let moves = 0;
        let matchedPairs = 0;
        let canFlip = true;
        let currentDifficulty = 6;

        function initGame() {
            moves = 0;
            matchedPairs = 0;
            flippedCards = [];
            canFlip = true;

            movesDisplay.textContent = `移动: ${moves}`;
            pairsDisplay.textContent = `匹配: ${matchedPairs}/${currentDifficulty}`;
            totalPairsDisplay.textContent = currentDifficulty;

            gameContainer.innerHTML = '';
            cards = [];

            setupGridLayout();

            const cardValues = cardSymbols.slice(0, currentDifficulty);
            const pairedCards = [...cardValues, ...cardValues];
            const shuffledCards = pairedCards.sort(() => Math.random() - 0.5);

            shuffledCards.forEach((value, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.value = value;

                const cardFront = document.createElement('div');
                cardFront.className = 'card-face card-front';

                const cardBack = document.createElement('div');
                cardBack.className = 'card-face card-back';
                cardBack.textContent = value;

                card.appendChild(cardFront);
                card.appendChild(cardBack);

                card.addEventListener('click', flipCard);

                gameContainer.appendChild(card);
                cards.push(card);
            });
        }

        function setupGridLayout() {
            let columns, rows;
            if (currentDifficulty <= 4) {
                columns = 4; rows = 2;
            } else if (currentDifficulty <= 6) {
                columns = 4; rows = 3;
            } else if (currentDifficulty <= 8) {
                columns = 4; rows = 4;
            } else if (currentDifficulty <= 10) {
                columns = 5; rows = 4;
            }
            gameContainer.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;
            gameContainer.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
        }

        function flipCard() {
            if (!canFlip || this.classList.contains('flipped') || this.classList.contains('matched')) {
                return;
            }
            if (flippedCards.length === 2) return;

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                canFlip = false;
                moves++;
                movesDisplay.textContent = `移动: ${moves}`;
                checkForMatch();
            }
        }

        function checkForMatch() {
            const [card1, card2] = flippedCards;

            if (card1.dataset.value === card2.dataset.value) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                pairsDisplay.textContent = `匹配: ${matchedPairs}/${currentDifficulty}`;

                card1.classList.add('celebrate');
                card2.classList.add('celebrate');
                setTimeout(() => {
                    card1.classList.remove('celebrate');
                    card2.classList.remove('celebrate');
                }, 1500);

                flippedCards = [];
                canFlip = true;

                if (matchedPairs === currentDifficulty) {
                    setTimeout(() => endGame(), 500);
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    canFlip = true;
                }, 1000);
            }
        }

        function endGame() {
            const finalMessage = `恭喜！你赢了！\n移动次数: ${moves}\n${getPerformanceRating(moves)}`;
            alert(finalMessage);
        }

        function getPerformanceRating(moves) {
            const rating = moves / currentDifficulty;
            if (rating <= 1.2) return "🌟 完美记忆！你是记忆大师！";
            if (rating <= 1.5) return "👍 非常出色！接近完美了！";
            if (rating <= 2.0) return "👏 表现不错！继续努力！";
            return "💪 再接再厉！多练习会更好！";
        }

        function setDifficulty(pairs) {
            currentDifficulty = parseInt(pairs);
            difficultyBtns.forEach(btn => {
                btn.classList.remove('selected');
                if (btn.dataset.pairs === pairs) {
                    btn.classList.add('selected');
                }
            });
            initGame();
        }

        difficultyBtns.forEach(btn => {
            btn.addEventListener('click', () => setDifficulty(btn.dataset.pairs));
        });

        restartBtn.addEventListener('click', initGame);

        initGame();
    </script>
</body>
</html>
