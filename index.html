<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tangent</title>
    <meta name="description" content="Tangent 的个人站点">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0a14;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        canvas#stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .overlay {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            margin-bottom: 28px;
            background-image: url('https://sixingwang2025.github.io/page/static/images/fbg.jpg');
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 40px rgba(140,160,255,0.15);
        }

        .typewriter-wrap {
            font-size: clamp(26px, 6vw, 42px);
            font-weight: 300;
            letter-spacing: 3px;
            color: #c8d6ff;
            margin-bottom: 6px;
            min-height: 1.3em;
        }
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #8899cc;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .subtitle {
            font-size: 15px;
            color: rgba(255,255,255,0.35);
            letter-spacing: 5px;
            margin-bottom: 52px;
        }

        .cards {
            display: flex;
            gap: 18px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            flex: 1 1 170px;
            max-width: 190px;
            min-width: 140px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 30px 18px 24px;
            cursor: pointer;
            transition: all 0.35s ease;
            text-decoration: none;
            color: #ccc;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .card:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-4px);
            box-shadow: 0 12px 36px rgba(0,0,0,0.4), 0 0 0 1px rgba(140,160,255,0.1) inset;
        }

        .card-icon { font-size: 36px; line-height: 1; }
        .card-title { font-size: 18px; font-weight: 500; letter-spacing: 2px; color: #d4dfff; }
        .card-desc { font-size: 12px; color: rgba(255,255,255,0.3); line-height: 1.5; }

        .footer {
            margin-top: 56px;
            font-size: 13px;
            color: rgba(255,255,255,0.25);
        }
        .footer a { color: rgba(255,255,255,0.35); text-decoration: none; transition: color .2s; }
        .footer a:hover { color: rgba(255,255,255,0.7); }

        @media (max-width: 500px) {
            .cards { gap: 12px; }
            .card { flex: 1 1 120px; min-width: 100px; padding: 22px 12px 18px; }
            .card-title { font-size: 15px; }
        }
    </style>
</head>
<body>
    <canvas id="stars"></canvas>

    <div class="overlay">
        <div class="avatar"></div>
        <div class="typewriter-wrap"><span id="typewriter"></span><span class="cursor"></span></div>
        <p class="subtitle">学 无 止 境 · 行 以 致 远</p>

        <div class="cards">
            <a class="card" href="/nav/">
                <span class="card-icon">🧭</span>
                <span class="card-title">导航</span>
                <span class="card-desc">常用工具与资源</span>
            </a>
            <a class="card" href="/blog/">
                <span class="card-icon">📝</span>
                <span class="card-title">博客</span>
                <span class="card-desc">技术与生活思考</span>
            </a>
            <a class="card" href="/page/">
                <span class="card-icon">🙋</span>
                <span class="card-title">关于</span>
                <span class="card-desc">了解更多关于我</span>
            </a>
        </div>

        <p class="footer">
            <a href="https://github.com/PaleTangent">GitHub</a>
            &nbsp;·&nbsp;
            <a href="mailto:sixingwang2025@163.com">Email</a>
        </p>
    </div>

    <script>
    /* === 星空 + 流星 + 鼠标连线 === */
    (function() {
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let w, h, stars = [], mouse = { x: -999, y: -999 };
        const STAR_COUNT = 130;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 初始化星星
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 1.6 + 0.4,
                twinkle: Math.random() * Math.PI * 2,
                twinkleSpeed: Math.random() * 0.02 + 0.005,
            });
        }

        // 流星
        let meteors = [];
        function spawnMeteor() {
            meteors.push({
                x: Math.random() * w * 0.8,
                y: Math.random() * -100 - 50,
                vx: 3 + Math.random() * 4,
                vy: 2 + Math.random() * 3,
                life: 1,
                decay: 0.012 + Math.random() * 0.02,
                len: 60 + Math.random() * 80,
            });
        }
        setInterval(() => { if (Math.random() < 0.5) spawnMeteor(); }, 2500);
        spawnMeteor();

        // 鼠标跟踪
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseleave', () => { mouse.x = -999; mouse.y = -999; });

        function draw() {
            ctx.clearRect(0, 0, w, h);

            // 星星
            for (const s of stars) {
                s.twinkle += s.twinkleSpeed;
                const alpha = 0.4 + 0.6 * Math.abs(Math.sin(s.twinkle));
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(180,200,255,${alpha.toFixed(2)})`;
                ctx.fill();
            }

            // 鼠标附近的连线
            for (const s of stars) {
                const dx = s.x - mouse.x, dy = s.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 120) {
                    ctx.beginPath();
                    ctx.moveTo(mouse.x, mouse.y);
                    ctx.lineTo(s.x, s.y);
                    ctx.strokeStyle = `rgba(140,170,255,${(1 - dist / 120).toFixed(2) * 0.35})`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }

            // 流星
            for (let i = meteors.length - 1; i >= 0; i--) {
                const m = meteors[i];
                m.x += m.vx; m.y += m.vy;
                m.life -= m.decay;
                if (m.life <= 0) { meteors.splice(i, 1); continue; }
                const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * m.len / 5, m.y - m.vy * m.len / 5);
                grad.addColorStop(0, `rgba(255,255,255,${m.life})`);
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(m.x - m.vx * m.len / 5, m.y - m.vy * m.len / 5);
                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.2;
                ctx.stroke();
            }

            requestAnimationFrame(draw);
        }

        draw();

        // 打字机
        const el = document.getElementById('typewriter');
        const text = 'Tan.gen.t';
        let index = 0, forward = true;
        function type() {
            if (forward) {
                el.textContent = text.slice(0, index + 1);
                index++;
                if (index === text.length) { forward = false; setTimeout(type, 2000); return; }
            } else {
                el.textContent = text.slice(0, index - 1);
                index--;
                if (index === 0) { forward = true; setTimeout(type, 800); return; }
            }
            setTimeout(type, forward ? 120 + Math.random() * 100 : 50 + Math.random() * 40);
        }
        type();
    })();
    </script>
</body>
</html>
