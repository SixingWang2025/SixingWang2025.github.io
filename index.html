<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tangent</title>
    <meta name="description" content="Tangent 的个人站点">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            overflow-x: hidden;
        }

        .bg-decoration {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
        }
        .bg-1 {
            width: 400px; height: 400px;
            background: #667eea;
            top: -100px; left: -100px;
        }
        .bg-2 {
            width: 300px; height: 300px;
            background: #764ba2;
            bottom: -80px; right: -80px;
        }
        .bg-3 {
            width: 250px; height: 250px;
            background: #f093fb;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px 20px;
            max-width: 680px;
            width: 100%;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.3);
            margin: 0 auto 24px;
            background-image: url('https://sixingwang2025.github.io/page/static/images/fbg.jpg');
            background-size: cover;
            background-position: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: clamp(28px, 6vw, 44px);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #e0e7ff, #c4b5fd, #f0abfc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 16px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 48px;
            letter-spacing: 4px;
        }

        .cards {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            flex: 1 1 180px;
            max-width: 200px;
            min-width: 150px;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 32px 20px 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .card:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.25);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }

        .card-icon {
            font-size: 40px;
            line-height: 1;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .card-desc {
            font-size: 13px;
            color: rgba(255,255,255,0.45);
            line-height: 1.5;
        }

        .footer {
            margin-top: 48px;
            font-size: 13px;
            color: rgba(255,255,255,0.3);
        }
        .footer a {
            color: rgba(255,255,255,0.4);
            text-decoration: none;
        }
        .footer a:hover { color: rgba(255,255,255,0.7); }

        @media (max-width: 520px) {
            .cards { gap: 14px; }
            .card { flex: 1 1 140px; min-width: 120px; padding: 24px 14px 20px; }
            .card-title { font-size: 17px; }
            .card-desc { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="bg-decoration bg-1"></div>
    <div class="bg-decoration bg-2"></div>
    <div class="bg-decoration bg-3"></div>

    <div class="container">
        <div class="avatar"></div>
        <h1>Tangxun</h1>
        <p class="subtitle">学无止境 · 行以致远</p>

        <div class="cards">
            <a class="card" href="/nav/">
                <span class="card-icon">🧭</span>
                <span class="card-title">导航</span>
                <span class="card-desc">常用工具与资源收藏</span>
            </a>
            <a class="card" href="/blog/">
                <span class="card-icon">📝</span>
                <span class="card-title">博客</span>
                <span class="card-desc">记录技术与生活思考</span>
            </a>
            <a class="card" href="/page/">
                <span class="card-icon">🙋</span>
                <span class="card-title">关于</span>
                <span class="card-desc">了解更多关于我</span>
            </a>
        </div>

        <p class="footer">
            <a href="https://github.com/PaleTangent">GitHub</a>
            &nbsp;·&nbsp;
            <a href="mailto:sixingwang2025@163.com">Email</a>
        </p>
    </div>
</body>
</html>
