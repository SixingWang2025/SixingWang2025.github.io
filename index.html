<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tangent</title>
    <meta name="description" content="Tangent 的个人站点">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0a14;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        canvas#stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .overlay {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 20px 40px;
            text-align: center;
            transform: translateY(-6vh);
        }

        .avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            margin-bottom: 24px;
            background-image: url('https://sixingwang2025.github.io/page/static/images/favicon.jpg');
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 32px rgba(140,160,255,0.12);
        }

        .typewriter-wrap {
            font-size: clamp(26px, 6vw, 42px);
            font-weight: 300;
            letter-spacing: 4px;
            color: #d4dfff;
            margin-bottom: 4px;
            min-height: 1.3em;
        }
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #8899cc;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 5px;
            margin-bottom: 44px;
        }

        .nav-links {
            display: flex;
            flex-direction: row;
            gap: 1px;
            width: 100%;
            max-width: 720px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.07);
        }

        .nav-link {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 26px 28px;
            text-decoration: none;
            color: #c8d6ff;
            background: rgba(255,255,255,0.025);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .nav-link:hover {
            background: rgba(255,255,255,0.07);
        }
        .nav-link + .nav-link {
            border-left: 1px solid rgba(255,255,255,0.05);
        }

        .nav-link svg {
            flex-shrink: 0;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        .nav-link:hover svg { opacity: 1; }

        .nav-link .text { text-align: left; line-height: 1.4; }
        .nav-link .title { font-size: 19px; font-weight: 500; letter-spacing: 2px; }
        .nav-link .desc { font-size: 13px; color: rgba(255,255,255,0.28); margin-top: 3px; }

        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: rgba(255,255,255,0.22);
        }
        .footer a { color: rgba(255,255,255,0.32); text-decoration: none; transition: color .2s; }
        .footer a:hover { color: rgba(255,255,255,0.65); }

        @media (max-width: 560px) {
            .overlay { transform: translateY(-4vh); }
            .nav-links {
                flex-direction: column;
                border-radius: 10px;
                max-width: 100%;
            }
            .nav-link + .nav-link {
                border-left: none;
                border-top: 1px solid rgba(255,255,255,0.05);
            }
            .nav-link {
                padding: 18px 20px;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <canvas id="stars"></canvas>

    <div class="overlay">
        <div class="avatar"></div>
        <div class="typewriter-wrap"><span id="typewriter"></span><span class="cursor"></span></div>
        <p class="subtitle">学 无 止 境 · 行 以 致 远</p>

        <div class="nav-links">
            <a class="nav-link" href="/nav/">
                <!-- compass / navigation -->
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
                </svg>
                <span class="text">
                    <div class="title">导航</div>
                    <div class="desc">常用工具与资源收藏</div>
                </span>
            </a>
            <a class="nav-link" href="/blog/">
                <!-- book / article -->
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
                <span class="text">
                    <div class="title">博客</div>
                    <div class="desc">记录技术与生活思考</div>
                </span>
            </a>
            <a class="nav-link" href="/page/">
                <!-- user / about -->
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 1 0-16 0"/>
                </svg>
                <span class="text">
                    <div class="title">关于</div>
                    <div class="desc">了解更多关于我</div>
                </span>
            </a>
        </div>

        <p class="footer">
            <a href="https://github.com/SixingWang2025">GitHub</a>
            &nbsp;·&nbsp;
            <a href="mailto:sixingwang2025@163.com">Email</a>
        </p>
    </div>

    <script>
    (function() {
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let w, h, stars = [], mouse = { x: -999, y: -999 };

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < 120; i++) {
            stars.push({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 1.2 + 0.4,
                twinkle: Math.random() * Math.PI * 2,
                ts: Math.random() * 0.02 + 0.005,
            });
        }

        let meteors = [];
        function spawn() {
            meteors.push({
                x: Math.random() * w * 0.6,
                y: -100,
                vx: 2 + Math.random() * 3,
                vy: 1.5 + Math.random() * 2,
                life: 1,
                decay: 0.008 + Math.random() * 0.01,
                len: 80 + Math.random() * 100,
            });
        }
        setInterval(() => { if (Math.random() < 0.35) spawn(); }, 3000);
        spawn();

        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseleave', () => { mouse.x = -999; mouse.y = -999; });

        function draw() {
            ctx.clearRect(0, 0, w, h);

            for (const s of stars) {
                s.twinkle += s.ts;
                const a = 0.3 + 0.7 * Math.abs(Math.sin(s.twinkle));
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(190,210,255,${a.toFixed(2)})`;
                ctx.fill();
            }

            for (const s of stars) {
                const dx = s.x - mouse.x, dy = s.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 140) {
                    const p = 1 - dist / 140;
                    ctx.beginPath();
                    ctx.moveTo(mouse.x, mouse.y);
                    ctx.lineTo(s.x, s.y);
                    ctx.strokeStyle = `rgba(160,200,255,${(p * 0.55).toFixed(2)})`;
                    ctx.lineWidth = 0.8;
                    ctx.stroke();
                }
            }

            if (mouse.x > 0) {
                const g = ctx.createRadialGradient(mouse.x, mouse.y, 2, mouse.x, mouse.y, 10);
                g.addColorStop(0, 'rgba(180,210,255,0.25)');
                g.addColorStop(1, 'rgba(180,210,255,0)');
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 10, 0, Math.PI * 2);
                ctx.fillStyle = g;
                ctx.fill();
            }

            for (let i = meteors.length - 1; i >= 0; i--) {
                const m = meteors[i];
                m.x += m.vx; m.y += m.vy;
                m.life -= m.decay;
                if (m.life <= 0) { meteors.splice(i, 1); continue; }
                const ex = m.x - m.vx * m.len / 5;
                const ey = m.y - m.vy * m.len / 5;
                // glow
                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(ex, ey);
                ctx.strokeStyle = `rgba(150,180,220,${(m.life * 0.18).toFixed(2)})`;
                ctx.lineWidth = 3;
                ctx.stroke();
                // core
                const g = ctx.createLinearGradient(m.x, m.y, ex, ey);
                g.addColorStop(0, `rgba(230,240,255,${(m.life * 0.7).toFixed(2)})`);
                g.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(ex, ey);
                ctx.strokeStyle = g;
                ctx.lineWidth = 1.2;
                ctx.stroke();
            }

            requestAnimationFrame(draw);
        }
        draw();

        const el = document.getElementById('typewriter');
        const text = 'Tangent';
        let i = 0, fwd = true;
        function type() {
            if (fwd) {
                el.textContent = text.slice(0, i + 1);
                i++;
                if (i === text.length) { fwd = false; setTimeout(type, 2200); return; }
            } else {
                el.textContent = text.slice(0, i - 1);
                i--;
                if (i === 0) { fwd = true; setTimeout(type, 700); return; }
            }
            setTimeout(type, fwd ? 100 + Math.random() * 80 : 50 + Math.random() * 30);
        }
        type();
    })();
    </script>
</body>
</html>
