<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tangent</title>
    <meta name="description" content="Tangent 的个人站点">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0a14;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        canvas#stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .overlay {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            margin-bottom: 28px;
            background-image: url('https://sixingwang2025.github.io/page/static/images/fbg.jpg');
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 40px rgba(140,160,255,0.15);
        }

        .typewriter-wrap {
            font-size: clamp(26px, 6vw, 42px);
            font-weight: 300;
            letter-spacing: 4px;
            color: #d4dfff;
            margin-bottom: 6px;
            min-height: 1.3em;
        }
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #8899cc;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .subtitle {
            font-size: 15px;
            color: rgba(255,255,255,0.35);
            letter-spacing: 5px;
            margin-bottom: 52px;
        }

        .nav-links {
            display: flex;
            flex-direction: row;
            gap: 1px;
            width: 100%;
            max-width: 660px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .nav-link {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 20px 24px;
            text-decoration: none;
            color: #c8d6ff;
            background: rgba(255,255,255,0.03);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .nav-link:hover {
            background: rgba(255,255,255,0.08);
        }
        .nav-link + .nav-link {
            border-left: 1px solid rgba(255,255,255,0.06);
        }

        .nav-link .icon { font-size: 28px; line-height: 1; flex-shrink: 0; }
        .nav-link .text { text-align: left; line-height: 1.4; }
        .nav-link .title { font-size: 17px; font-weight: 500; letter-spacing: 2px; }
        .nav-link .desc { font-size: 12px; color: rgba(255,255,255,0.3); margin-top: 2px; }

        .footer {
            margin-top: 48px;
            font-size: 13px;
            color: rgba(255,255,255,0.25);
        }
        .footer a { color: rgba(255,255,255,0.35); text-decoration: none; transition: color .2s; }
        .footer a:hover { color: rgba(255,255,255,0.7); }

        @media (max-width: 560px) {
            .nav-links {
                flex-direction: column;
                border-radius: 10px;
            }
            .nav-link + .nav-link {
                border-left: none;
                border-top: 1px solid rgba(255,255,255,0.06);
            }
            .nav-link {
                padding: 16px 20px;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <canvas id="stars"></canvas>

    <div class="overlay">
        <div class="avatar"></div>
        <div class="typewriter-wrap"><span id="typewriter"></span><span class="cursor"></span></div>
        <p class="subtitle">学 无 止 境 · 行 以 致 远</p>

        <div class="nav-links">
            <a class="nav-link" href="/nav/">
                <span class="icon">🧭</span>
                <span class="text">
                    <div class="title">导航</div>
                    <div class="desc">常用工具与资源收藏</div>
                </span>
            </a>
            <a class="nav-link" href="/blog/">
                <span class="icon">📝</span>
                <span class="text">
                    <div class="title">博客</div>
                    <div class="desc">记录技术与生活思考</div>
                </span>
            </a>
            <a class="nav-link" href="/page/">
                <span class="icon">🙋</span>
                <span class="text">
                    <div class="title">关于</div>
                    <div class="desc">了解更多关于我</div>
                </span>
            </a>
        </div>

        <p class="footer">
            <a href="https://github.com/PaleTangent">GitHub</a>
            &nbsp;·&nbsp;
            <a href="mailto:sixingwang2025@163.com">Email</a>
        </p>
    </div>

    <script>
    /* === 星空 + 流星 + 鼠标连线 === */
    (function() {
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let w, h, stars = [], mouse = { x: -999, y: -999 };
        const STAR_COUNT = 120;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 1.4 + 0.5,
                twinkle: Math.random() * Math.PI * 2,
                twinkleSpeed: Math.random() * 0.02 + 0.005,
            });
        }

        let meteors = [];
        function spawnMeteor() {
            meteors.push({
                x: Math.random() * w * 0.8,
                y: Math.random() * -100 - 50,
                vx: 3 + Math.random() * 4,
                vy: 2 + Math.random() * 3,
                life: 1,
                decay: 0.012 + Math.random() * 0.02,
                len: 60 + Math.random() * 80,
            });
        }
        setInterval(() => { if (Math.random() < 0.5) spawnMeteor(); }, 2500);
        spawnMeteor();

        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseleave', () => { mouse.x = -999; mouse.y = -999; });

        function draw() {
            ctx.clearRect(0, 0, w, h);

            for (const s of stars) {
                s.twinkle += s.twinkleSpeed;
                const alpha = 0.35 + 0.65 * Math.abs(Math.sin(s.twinkle));
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(190,210,255,${alpha.toFixed(2)})`;
                ctx.fill();
            }

            // 鼠标连线 — 更明显的颜色和宽度
            for (const s of stars) {
                const dx = s.x - mouse.x, dy = s.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 140) {
                    const strength = (1 - dist / 140);
                    ctx.beginPath();
                    ctx.moveTo(mouse.x, mouse.y);
                    ctx.lineTo(s.x, s.y);
                    ctx.strokeStyle = `rgba(160,200,255,${(strength * 0.6).toFixed(2)})`;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }

            // 鼠标光标发光点
            if (mouse.x > 0) {
                const glow = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 20);
                glow.addColorStop(0, 'rgba(180,210,255,0.3)');
                glow.addColorStop(1, 'rgba(180,210,255,0)');
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 20, 0, Math.PI * 2);
                ctx.fillStyle = glow;
                ctx.fill();
            }

            for (let i = meteors.length - 1; i >= 0; i--) {
                const m = meteors[i];
                m.x += m.vx; m.y += m.vy;
                m.life -= m.decay;
                if (m.life <= 0) { meteors.splice(i, 1); continue; }
                const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * m.len / 5, m.y - m.vy * m.len / 5);
                grad.addColorStop(0, `rgba(255,255,255,${m.life})`);
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(m.x - m.vx * m.len / 5, m.y - m.vy * m.len / 5);
                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.2;
                ctx.stroke();
            }

            requestAnimationFrame(draw);
        }

        draw();

        // 打字机
        const el = document.getElementById('typewriter');
        const text = 'Tangent';
        let index = 0, forward = true;
        function type() {
            if (forward) {
                el.textContent = text.slice(0, index + 1);
                index++;
                if (index === text.length) { forward = false; setTimeout(type, 2200); return; }
            } else {
                el.textContent = text.slice(0, index - 1);
                index--;
                if (index === 0) { forward = true; setTimeout(type, 700); return; }
            }
            setTimeout(type, forward ? 110 + Math.random() * 90 : 50 + Math.random() * 35);
        }
        type();
    })();
    </script>
</body>
</html>
